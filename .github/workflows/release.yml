name: Release WindowManager

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Build release artifacts
        run: ./scripts/build-release.sh

      - name: Generate signed Sparkle appcast
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        run: |
          ./scripts/generate-appcast.sh dist docs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/appcast.xml
          git diff --cached --quiet || git commit -m "chore: update Sparkle appcast"
          git push origin HEAD:main

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/WindowManager-*.zip
            dist/WindowManager-*.dmg
            dist/SHA256SUMS
